<!DOCTYPE html>
<html lang="it" data-accento="ottone" data-titoli="serif">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: la pagina arriva fino ai bordi di iPhone (tacca compresa) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda</title>
  <meta name="theme-color" content="#09090a">
  <meta name="color-scheme" content="dark">

  <!-- Per l'installazione sulla schermata Home -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <link rel="apple-touch-icon" href="icone/icona-180.png">
  <link rel="icon" type="image/png" href="icone/icona-192.png">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componenti.css">
</head>
<body>
  <div class="app">

    <header class="testata">
      <div class="testata-riga">
        <div class="testata-data">
          <span class="etichetta" id="testata-giorno"></span>
          <h1 class="titolo" id="testata-data"></h1>
        </div>
        <div class="frecce">
          <button class="icona-pulsante" id="giorno-prima" aria-label="Giorno precedente">
            <svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
          </button>
          <button class="icona-pulsante" id="giorno-dopo" aria-label="Giorno successivo">
            <svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
          </button>
        </div>
      </div>
      <nav class="settimana" id="settimana" aria-label="Settimana"></nav>
    </header>

    <main>
      <div class="flessibili" id="flessibili"></div>
      <div class="timeline" id="timeline"></div>
      <p class="avviso-sovrapposizioni" id="avviso"></p>
    </main>

  </div>

  <!-- Azioni principali in basso, a portata di pollice -->
  <nav class="barra" aria-label="Azioni">
    <div class="barra-interno">
      <button class="barra-voce" id="vai-oggi">
        <svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="1.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
        Oggi
      </button>
      <button class="barra-aggiungi" id="aggiungi" aria-label="Aggiungi un blocco">
        <svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg>
      </button>
      <button class="barra-voce" id="altro">
        Altro
        <svg viewBox="0 0 24 24"><path d="M5 7.5h14M5 12h14M5 16.5h14"/></svg>
      </button>
    </div>
  </nav>

  <!-- type="module": permette a un file JavaScript di importarne altri -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
